name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # The gate sits two points below the measured coverage, so an unrelated
      # change does not fail the build for shaving a fraction off the number,
      # while a real drop in tested behaviour still does.
      - name: Run tests
        run: >
          uv run pytest -q
          --cov=src/quadruped_gait --cov-report=term-missing --cov-fail-under=96

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      # The committed figures are snapshots. This step checks that the command
      # documented in the README still runs and still writes them; it does not
      # compare the bytes, because Matplotlib output is not reproducible byte for
      # byte across platforms or font configurations.
      - name: Regenerate figures
        run: uv run python examples/docs_figures.py --figure-dir "${{ runner.temp }}/figures"
